; ============================================================================
; Medvox — PHP settings (production)
; ============================================================================

; --- Errors: never display, always log to stderr (captured by Docker) ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; --- Security ---
expose_php = Off
; Enable after dependencies are installed (composer needs some of these at runtime):
; disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,parse_ini_file,show_source

; --- OPcache (production: do not revalidate on every request) ---
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; --- Uploads / timezone ---
upload_max_filesize = 16M
post_max_size = 20M
date.timezone = UTC
