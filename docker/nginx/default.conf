# ============================================================================
# Medvox — Nginx configuration (production)
#
# For each of the three domains:
#   /api/  -> PHP-FPM (single front controller: backend/public/index.php)
#   /      -> the built SPA (static files from a Docker volume)
# ============================================================================

# --- Application 1: Main (http://mymedvox.ru) ---
server {
    listen 80;
    server_name mymedvox.ru;

    root /var/www/app-main;
    index index.html;

    # REST API -> PHP-FPM
    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
    }

    # SPA: serve static files, fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Application 2: AdminPanel (http://adminpanel.surveygo.ru) ---
server {
    listen 80;
    server_name adminpanel.surveygo.ru;

    root /var/www/app-admin-panel;
    index index.html;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Application 3: ProjectPanel (http://projectpanel.surveygo.ru) ---
server {
    listen 80;
    server_name projectpanel.surveygo.ru;

    root /var/www/app-project-panel;
    index index.html;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Default: reject unknown hosts ---
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
